name: Android RDP Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository files
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Run edit.sh
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SCRIPT="${GITHUB_WORKSPACE}/edit.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "INFO: edit.sh was not found. Skipping."
          else
            chmod +x "$SCRIPT"
            bash "$SCRIPT"
            echo "edit.sh step completed."
          fi
          exit 0

      - name: Initialize
        continue-on-error: true
        shell: bash
        run: |
          echo "Starting Android RDP pipeline..."
          echo "RDP_PORT=39211" >> "$GITHUB_ENV"
          exit 0

      - name: Configure System Access (XRDP & Desktop)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive
          RDP_PORT="${RDP_PORT:-39211}"

          echo "Installing XRDP, XFCE, and required libraries (silent mode)..."
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq \
            xrdp \
            xfce4 \
            dbus-x11 \
            unzip \
            curl \
            wmctrl \
            default-jre-headless \
            libpulse0 \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxtst6 >/dev/null 2>&1

          # Configure XRDP port 39211
          sudo sed -i "s/^port=3389/port=${RDP_PORT}/" /etc/xrdp/xrdp.ini
          sudo adduser xrdp ssl-cert >/dev/null 2>&1

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow "${RDP_PORT}/tcp" >/dev/null 2>&1
          fi

          sudo systemctl enable xrdp >/dev/null 2>&1
          sudo systemctl restart xrdp
          echo "SUCCESS: System access configured on port ${RDP_PORT}."
          exit 0

      - name: Prepare Account
        continue-on-error: true
        shell: bash
        run: |
          set +e
          USERNAME="black"
          PASS="2555"

          if ! id -u "$USERNAME" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$USERNAME"
          fi

          echo "${USERNAME}:${PASS}" | sudo chpasswd
          sudo usermod -aG sudo,kvm "$USERNAME" >/dev/null 2>&1 || true

          cat << 'EOF' | sudo tee "/home/${USERNAME}/.xsession" >/dev/null
          #!/bin/bash
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec xfce4-session
          EOF

          sudo chown "${USERNAME}:${USERNAME}" "/home/${USERNAME}/.xsession"
          sudo chmod +x "/home/${USERNAME}/.xsession"

          echo "USER=${USERNAME}" >> "$GITHUB_ENV"
          echo "PASS=${PASS}" >> "$GITHUB_ENV"
          echo "SUCCESS: Account ${USERNAME} configured."
          exit 0

      - name: Install Network Tool (Tailscale)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          sudo systemctl enable --now tailscaled >/dev/null 2>&1
          echo "SUCCESS: Tailscale installed."
          exit 0

      - name: Connect Network (Tailscale)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "=== TAILSCALE START ==="

          KEY="${{ secrets.TAILSCALE_AUTH_KEY }}"
          if [ "${#KEY}" -lt 10 ]; then
            echo "WARNING: TAILSCALE_AUTH_KEY is empty or too short."
          else
            sudo tailscale logout >/dev/null 2>&1

            sudo tailscale up \
              --authkey="${KEY}" \
              --hostname="android-builder-${{ github.run_id }}" \
              --reset \
              --accept-routes=false \
              --accept-dns=false >/dev/null 2>&1

            IP=""
            for i in $(seq 1 12); do
              sleep 5
              IP=$(tailscale ip -4 2>/dev/null | head -n 1 | tr -d '[:space:]')
              if [ -n "$IP" ]; then
                echo "Tailscale IP = $IP"
                break
              fi
              echo "Attempt $i/12 - waiting for IP..."
            done

            if [ -n "$IP" ]; then
              echo "IP=$IP" >> "$GITHUB_ENV"
            else
              echo "WARNING: Could not obtain Tailscale IP."
            fi
          fi

          echo "=== TAILSCALE END ==="
          exit 0

      - name: Install Android 13 & Google Play (Official SDK)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          export ANDROID_HOME="/opt/android-sdk"
          export ANDROID_AVD_HOME="/home/black/.android"

          sudo mkdir -p "${ANDROID_HOME}/cmdline-tools" "${ANDROID_AVD_HOME}"
          sudo chown -R black:black "${ANDROID_HOME}" "${ANDROID_AVD_HOME}"

          echo "Downloading Android Command-Line Tools from dl.google.com..."
          CMD_URL=$(curl -fsSL "https://developer.android.com/studio" \
            | grep -oE 'https://dl\.google\.com/android/repository/commandlinetools-linux-[0-9]+_latest\.zip' \
            | head -n 1)

          if [ -z "$CMD_URL" ]; then
            CMD_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          fi

          curl -fsSL "$CMD_URL" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmd_extract
          mv /tmp/cmd_extract/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
          rm -rf /tmp/cmdline-tools.zip /tmp/cmd_extract

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"

          echo "Installing Android 13 System Image (Google Play x86_64) & Emulator..."
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null 2>&1
          "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "emulator" \
            "system-images;android-33;google_apis_playstore;x86_64" >/dev/null 2>&1

          echo "Creating Android 13 Virtual Device..."
          echo "no" | sudo -u black env \
            ANDROID_HOME="${ANDROID_HOME}" \
            ANDROID_AVD_HOME="${ANDROID_AVD_HOME}" \
            "$AVDMANAGER" create avd \
            -f \
            -n android \
            -k "system-images;android-33;google_apis_playstore;x86_64" >/dev/null 2>&1

          CONFIG_INI="${ANDROID_AVD_HOME}/avd/android.avd/config.ini"
          if [ -f "$CONFIG_INI" ]; then
            cat << 'EOF' | sudo -u black tee -a "$CONFIG_INI" >/dev/null
          hw.lcd.width=1280
          hw.lcd.height=720
          hw.lcd.density=213
          hw.keyboard=yes
          hw.ramSize=4096
          disk.dataPartition.size=8G
          EOF
            echo "SUCCESS: Android 13 with Google Play is installed and ready."
          else
            echo "WARNING: AVD config.ini was not created."
          fi
          exit 0

      - name: Apply Desktop & Android Autostart Preferences
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LAUNCH_SCRIPT="/home/black/launch-android.sh"
          AUTOSTART_DIR="/home/black/.config/autostart"

          sudo mkdir -p "$AUTOSTART_DIR"

          cat << 'EOF' | sudo tee "$LAUNCH_SCRIPT" >/dev/null
          #!/bin/bash
          export ANDROID_HOME="/opt/android-sdk"
          export ANDROID_AVD_HOME="/home/black/.android"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          xset s off -dpms >/dev/null 2>&1

          if ! pgrep -f "qemu-system-x86_64" >/dev/null; then
            "$ANDROID_HOME/emulator/emulator" \
              -avd android \
              -no-snapshot \
              -no-boot-anim \
              -no-audio \
              -gpu swiftshader_indirect \
              -memory 4096 \
              -cores 4 >/tmp/android-emulator.log 2>&1 &
          fi

          for i in $(seq 1 30); do
            sleep 1
            if wmctrl -l | grep -qi "Android Emulator"; then
              wmctrl -r "Android Emulator" -b add,maximized_vert,maximized_horz >/dev/null 2>&1
              break
            fi
          done
          EOF

          cat << 'EOF' | sudo tee "${AUTOSTART_DIR}/android-emulator.desktop" >/dev/null
          [Desktop Entry]
          Type=Application
          Name=Android 13
          Exec=/home/black/launch-android.sh
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF

          sudo chmod +x "$LAUNCH_SCRIPT"
          sudo chown -R black:black /home/black
          sudo systemctl restart xrdp
          echo "SUCCESS: Desktop preferences and Android autostart configured."
          exit 0

      - name: Connection Info
        continue-on-error: true
        shell: bash
        run: |
          RDP_PORT="${RDP_PORT:-39211}"
          echo "====================================="
          echo "Address  → ${IP}:${RDP_PORT}"
          echo "Username → black"
          echo "Password → 2555"
          echo "====================================="
          exit 0

      - name: Install Python requests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 -m pip install -q --upgrade pip requests --break-system-packages >/dev/null 2>&1 || true
          echo "SUCCESS: Python requests installed."
          exit 0

      - name: Run Optional setup.sh
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SCRIPT="${GITHUB_WORKSPACE}/setup.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "INFO: setup.sh was not found. Skipping."
          else
            chmod +x "$SCRIPT"
            bash "$SCRIPT"
          fi
          exit 0

      - name: Create and run startup.sh
        continue-on-error: true
        shell: bash
        run: |
          set +e
          STARTUP_PATH="/home/black/startup.sh"

          cat << 'EOF' | sudo tee "$STARTUP_PATH" >/dev/null
          #!/bin/bash
          echo "============================================"
          echo "STARTUP.SH"
          echo "============================================"
          echo "Host: $(hostname)"
          echo "User: $(whoami)"
          echo "Started at: $(date)"
          echo "XRDP & Android 13 AVD are ready."
          echo "============================================"
          EOF

          sudo chown black:black "$STARTUP_PATH"
          sudo chmod +x "$STARTUP_PATH"
          sudo -u black bash "$STARTUP_PATH"
          exit 0

      - name: Keep Online - 5h 45m
        continue-on-error: true
        shell: bash
        run: |
          set +e
          TOTAL_SECONDS=$((5 * 3600 + 45 * 60))

          echo "============================================"
          echo "KEEP ONLINE MODE"
          echo "Duration: 5 hours 45 minutes"
          echo "============================================"

          for ((i=0; i<TOTAL_SECONDS; i+=300)); do
            REMAINING=$((TOTAL_SECONDS - i))
            HOURS=$((REMAINING / 3600))
            MINUTES=$(( (REMAINING % 3600) / 60 ))

            echo ""
            echo "[$(date)] Runner is active"
            echo "Remaining: ${HOURS} hours ${MINUTES} minutes"

            sleep 300
          done

          echo ""
          echo "============================================"
          echo "SESSION COMPLETED"
          echo "============================================"
          exit 0
