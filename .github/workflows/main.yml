name: Android 11 Tablet RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository files
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Run edit.sh
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SCRIPT="${GITHUB_WORKSPACE}/edit.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "INFO: edit.sh was not found. Skipping."
          else
            chmod +x "$SCRIPT"
            bash "$SCRIPT"
            echo "edit.sh step completed."
          fi
          exit 0

      - name: Initialize
        continue-on-error: true
        shell: bash
        run: |
          echo "Starting lightweight Android 11 pipeline..."
          echo "RDP_PORT=39211" >> "$GITHUB_ENV"
          exit 0

      - name: Configure System Access (XRDP & Openbox)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive
          RDP_PORT="${RDP_PORT:-39211}"

          echo "Installing XRDP, Openbox, and Android Emulator dependencies..."
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq \
            xrdp \
            openbox \
            x11-xserver-utils \
            xterm \
            unzip \
            curl \
            default-jre-headless \
            libpulse0 \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxtst6 \
            libxcb-cursor0 \
            libxkbfile1 >/dev/null 2>&1

          sudo sed -i "s/^port=3389/port=${RDP_PORT}/" /etc/xrdp/xrdp.ini
          sudo adduser xrdp ssl-cert >/dev/null 2>&1

          cat << 'EOF' | sudo tee /etc/xrdp/startwm.sh >/dev/null
          #!/bin/bash
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi
          xsetroot -solid "#000000" >/dev/null 2>&1 || true
          xset s off -dpms >/dev/null 2>&1 || true
          /home/black/launch-android.sh &
          exec openbox-session
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow "${RDP_PORT}/tcp" >/dev/null 2>&1
          fi

          sudo systemctl enable xrdp >/dev/null 2>&1
          sudo systemctl restart xrdp
          echo "SUCCESS: XRDP + Openbox configured on port ${RDP_PORT}."
          exit 0

      - name: Prepare Account
        continue-on-error: true
        shell: bash
        run: |
          set +e
          USERNAME="black"
          PASS="2555"

          if ! id -u "$USERNAME" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$USERNAME"
          fi

          echo "${USERNAME}:${PASS}" | sudo chpasswd
          sudo usermod -aG sudo,kvm "$USERNAME" >/dev/null 2>&1 || true

          # Center Android window cleanly without distortion or stretching
          OPENBOX_DIR="/home/${USERNAME}/.config/openbox"
          sudo mkdir -p "$OPENBOX_DIR"

          cat << 'EOF' | sudo tee "${OPENBOX_DIR}/rc.xml" >/dev/null
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <applications>
              <application class="*">
                <decor>no</decor>
                <position force="yes">
                  <x>center</x>
                  <y>center</y>
                </position>
              </application>
            </applications>
          </openbox_config>
          EOF

          cat << 'EOF' | sudo tee "${OPENBOX_DIR}/menu.xml" >/dev/null
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_menu xmlns="http://openbox.org/3.4/menu">
            <menu id="root-menu" label="Menu">
              <item label="Start Android 11">
                <action name="Execute"><command>/home/black/launch-android.sh</command></action>
              </item>
              <item label="Terminal">
                <action name="Execute"><command>xterm</command></action>
              </item>
            </menu>
          </openbox_menu>
          EOF

          sudo chown -R "${USERNAME}:${USERNAME}" "/home/${USERNAME}"
          echo "USER=${USERNAME}" >> "$GITHUB_ENV"
          echo "PASS=${PASS}" >> "$GITHUB_ENV"
          echo "SUCCESS: Account ${USERNAME} configured."
          exit 0

      - name: Install Network Tool (Tailscale)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          sudo systemctl enable --now tailscaled >/dev/null 2>&1
          echo "SUCCESS: Tailscale installed."
          exit 0

      - name: Connect Network (Tailscale)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "=== TAILSCALE START ==="

          KEY="${{ secrets.TAILSCALE_AUTH_KEY }}"
          if [ "${#KEY}" -lt 10 ]; then
            echo "WARNING: TAILSCALE_AUTH_KEY is empty or too short."
          else
            sudo tailscale logout >/dev/null 2>&1

            sudo tailscale up \
              --authkey="${KEY}" \
              --hostname="android11-tablet-${{ github.run_id }}" \
              --reset \
              --accept-routes=false \
              --accept-dns=false >/dev/null 2>&1

            IP=""
            for i in $(seq 1 12); do
              sleep 5
              IP=$(tailscale ip -4 2>/dev/null | head -n 1 | tr -d '[:space:]')
              if [ -n "$IP" ]; then
                echo "Tailscale IP = $IP"
                break
              fi
              echo "Attempt $i/12 - waiting for IP..."
            done

            if [ -n "$IP" ]; then
              echo "IP=$IP" >> "$GITHUB_ENV"
            else
              echo "WARNING: Could not obtain Tailscale IP."
            fi
          fi

          echo "=== TAILSCALE END ==="
          exit 0

      - name: Install & Pre-Boot Android 11 (Ultra-Wide Tablet)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          export ANDROID_HOME="/opt/android-sdk"
          export ANDROID_AVD_HOME="/home/black/.android"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          sudo mkdir -p "${ANDROID_HOME}/cmdline-tools" "${ANDROID_AVD_HOME}"
          sudo chown -R black:black "${ANDROID_HOME}" "${ANDROID_AVD_HOME}"

          echo "Downloading Android Command-Line Tools..."
          CMD_URL=$(curl -fsSL "https://developer.android.com/studio" \
            | grep -oE 'https://dl\.google\.com/android/repository/commandlinetools-linux-[0-9]+_latest\.zip' \
            | head -n 1)

          if [ -z "$CMD_URL" ]; then
            CMD_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          fi

          curl -fsSL "$CMD_URL" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmd_extract
          mv /tmp/cmd_extract/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
          rm -rf /tmp/cmdline-tools.zip /tmp/cmd_extract

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"

          echo "Installing Lightweight Android 11 (API 30) System Image..."
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null 2>&1
          "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "emulator" \
            "system-images;android-30;default;x86_64" >/dev/null 2>&1

          echo "Creating Ultra-Wide Tablet AVD (1600x900)..."
          echo "no" | sudo -u black env \
            ANDROID_HOME="${ANDROID_HOME}" \
            ANDROID_AVD_HOME="${ANDROID_AVD_HOME}" \
            "$AVDMANAGER" create avd \
            -f \
            -n android \
            -k "system-images;android-30;default;x86_64" >/dev/null 2>&1

          CONFIG_INI="${ANDROID_AVD_HOME}/avd/android.avd/config.ini"
          if [ -f "$CONFIG_INI" ]; then
            cat << 'EOF' | sudo -u black tee -a "$CONFIG_INI" >/dev/null
          hw.lcd.width=1600
          hw.lcd.height=900
          hw.lcd.density=200
          hw.keyboard=yes
          hw.ramSize=6144
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          disk.dataPartition.size=8G
          EOF
          fi

          echo "Pre-booting Android 11 to complete first-time optimization..."
          sudo -u black env \
            ANDROID_HOME="${ANDROID_HOME}" \
            ANDROID_AVD_HOME="${ANDROID_AVD_HOME}" \
            "$ANDROID_HOME/emulator/emulator" \
            -avd android \
            -no-window \
            -no-boot-anim \
            -no-audio \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -memory 6144 \
            -cores 4 >/tmp/android-preboot.log 2>&1 &

          BOOTED=0
          for i in $(seq 1 30); do
            sleep 3
            STATUS=$(sudo -u black "$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')
            if [ "$STATUS" = "1" ]; then
              BOOTED=1
              break
            fi
          done

          if [ "$BOOTED" -eq 1 ]; then
            sudo -u black "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
            sudo -u black "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
            sudo -u black "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
            sudo -u black "$ANDROID_HOME/platform-tools/adb" shell settings put system screen_off_timeout 2147483647
            sudo -u black "$ANDROID_HOME/platform-tools/adb" shell settings put global stay_on_while_plugged_in 7
            sudo -u black "$ANDROID_HOME/platform-tools/adb" shell cmd uimode night yes
            sudo -u black "$ANDROID_HOME/platform-tools/adb" emu kill >/dev/null 2>&1 || true
            sleep 3
            echo "SUCCESS: Android 11 pre-booted and optimized for instant startup."
          else
            echo "WARNING: Pre-boot timed out, will boot normally on login."
            pkill -f "qemu-system-x86_64" >/dev/null 2>&1 || true
          fi
          exit 0

      - name: Configure Android Launcher
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LAUNCH_SCRIPT="/home/black/launch-android.sh"

          cat << 'EOF' | sudo tee "$LAUNCH_SCRIPT" >/dev/null
          #!/bin/bash
          export ANDROID_HOME="/opt/android-sdk"
          export ANDROID_AVD_HOME="/home/black/.android"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          sleep 1
          if ! pgrep -f "qemu-system-x86_64" >/dev/null; then
            "$ANDROID_HOME/emulator/emulator" \
              -avd android \
              -skin 1600x900 \
              -no-boot-anim \
              -no-audio \
              -no-snapshot \
              -gpu swiftshader_indirect \
              -memory 6144 \
              -cores 4 >/tmp/android-emulator.log 2>&1 &
          fi
          EOF

          sudo chmod +x "$LAUNCH_SCRIPT"
          sudo chown -R black:black /home/black
          sudo systemctl restart xrdp
          echo "SUCCESS: Android 11 launcher configured."
          exit 0

      - name: Connection Info
        continue-on-error: true
        shell: bash
        run: |
          RDP_PORT="${RDP_PORT:-39211}"
          echo "====================================="
          echo "Address  → ${IP}:${RDP_PORT}"
          echo "Username → black"
          echo "Password → 2555"
          echo "====================================="
          exit 0

      - name: Install Python requests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 -m pip install -q --upgrade pip requests --break-system-packages >/dev/null 2>&1 || true
          echo "SUCCESS: Python requests installed."
          exit 0

      - name: Run Optional setup.sh
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SCRIPT="${GITHUB_WORKSPACE}/setup.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "INFO: setup.sh was not found. Skipping."
          else
            chmod +x "$SCRIPT"
            bash "$SCRIPT"
          fi
          exit 0

      - name: Create and run startup.sh
        continue-on-error: true
        shell: bash
        run: |
          set +e
          STARTUP_PATH="/home/black/startup.sh"

          cat << 'EOF' | sudo tee "$STARTUP_PATH" >/dev/null
          #!/bin/bash
          echo "============================================"
          echo "STARTUP.SH"
          echo "============================================"
          echo "Host: $(hostname)"
          echo "User: $(whoami)"
          echo "Started at: $(date)"
          echo "XRDP & Android 11 (1600x900 Tablet) ready."
          echo "============================================"
          EOF

          sudo chown black:black "$STARTUP_PATH"
          sudo chmod +x "$STARTUP_PATH"
          sudo -u black bash "$STARTUP_PATH"
          exit 0

      - name: Keep Online - 5h 45m
        continue-on-error: true
        shell: bash
        run: |
          set +e
          TOTAL_SECONDS=$((5 * 3600 + 45 * 60))

          echo "============================================"
          echo "KEEP ONLINE MODE"
          echo "Duration: 5 hours 45 minutes"
          echo "============================================"

          for ((i=0; i<TOTAL_SECONDS; i+=300)); do
            REMAINING=$((TOTAL_SECONDS - i))
            HOURS=$((REMAINING / 3600))
            MINUTES=$(( (REMAINING % 3600) / 60 ))

            echo ""
            echo "[$(date)] Runner is active"
            echo "Remaining: ${HOURS} hours ${MINUTES} minutes"

            sleep 300
          done

          echo ""
          echo "============================================"
          echo "SESSION COMPLETED"
          echo "============================================"
          exit 0
