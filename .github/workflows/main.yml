name: Android RDP Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository files
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Run edit.sh
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SCRIPT="${GITHUB_WORKSPACE}/edit.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "INFO: edit.sh was not found. Skipping."
          else
            chmod +x "$SCRIPT"
            bash "$SCRIPT"
            echo "edit.sh step completed."
          fi
          exit 0

      - name: Initialize
        continue-on-error: true
        shell: bash
        run: |
          echo "Starting Android RDP pipeline..."
          echo "RDP_PORT=39211" >> "$GITHUB_ENV"
          exit 0

      - name: Configure System Access (XRDP & QEMU)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive
          RDP_PORT="${RDP_PORT:-39211}"

          echo "Installing XRDP, XFCE, QEMU/KVM, and VNC viewer..."
          sudo apt-get update -y
          sudo apt-get install -y \
            xrdp \
            xfce4 \
            dbus-x11 \
            qemu-system-x86 \
            qemu-utils \
            tigervnc-viewer \
            curl

          # Configure XRDP to listen on port 39211
          sudo sed -i "s/^port=3389/port=${RDP_PORT}/" /etc/xrdp/xrdp.ini
          sudo adduser xrdp ssl-cert >/dev/null 2>&1

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow "${RDP_PORT}/tcp" >/dev/null 2>&1
          fi

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          echo "System access configured on port ${RDP_PORT}."
          exit 0

      - name: Prepare Account
        continue-on-error: true
        shell: bash
        run: |
          set +e
          PASS='ia-K;mNYg7^=^rG'

          if ! id -u runneradmin >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash runneradmin
          fi

          echo "runneradmin:${PASS}" | sudo chpasswd
          sudo usermod -aG sudo,kvm runneradmin 2>/dev/null || true

          # Configure XFCE session for XRDP
          echo "xfce4-session" | sudo tee /home/runneradmin/.xsession >/dev/null
          sudo chown runneradmin:runneradmin /home/runneradmin/.xsession
          sudo chmod +x /home/runneradmin/.xsession

          echo "USER=runneradmin" >> "$GITHUB_ENV"
          echo "PASS=${PASS}" >> "$GITHUB_ENV"
          echo "Account runneradmin configured."
          exit 0

      - name: Install Network Tool
        continue-on-error: true
        shell: bash
        run: |
          set +e
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled
          echo "Tailscale installed."
          exit 0

      - name: Connect Network
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "=== TAILSCALE START ==="

          KEY="${{ secrets.TAILSCALE_AUTH_KEY }}"
          if [ "${#KEY}" -lt 10 ]; then
            echo "WARNING: TAILSCALE_AUTH_KEY is empty or too short."
          else
            sudo tailscale logout >/dev/null 2>&1

            sudo tailscale up \
              --authkey="${KEY}" \
              --hostname="android-builder-${{ github.run_id }}" \
              --reset \
              --accept-routes=false \
              --accept-dns=false

            tailscale status

            IP=""
            for i in $(seq 1 12); do
              sleep 5
              IP=$(tailscale ip -4 2>/dev/null | head -n 1 | tr -d '[:space:]')
              if [ -n "$IP" ]; then
                echo "Tailscale IP = $IP"
                break
              fi
              echo "Attempt $i/12 - no IP yet..."
            done

            if [ -n "$IP" ]; then
              echo "IP=$IP" >> "$GITHUB_ENV"
            else
              echo "WARNING: Could not obtain Tailscale IP."
            fi
          fi

          echo "=== TAILSCALE END ==="
          exit 0

      - name: Boot Android OS (QEMU/KVM)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sudo mkdir -p /opt/android /mnt/iso /mnt/adisk

          echo "Downloading Android-x86_64 image..."
          curl -fL --retry 3 --retry-delay 5 -A "Mozilla/5.0" \
            "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download" \
            -o /tmp/android.iso

          if [ ! -f /tmp/android.iso ] || [ "$(stat -c%s /tmp/android.iso)" -lt 500000000 ]; then
            echo "ERROR: Android ISO download failed or incomplete."
            exit 0
          fi

          echo "Extracting kernel and system image..."
          sudo mount -o loop /tmp/android.iso /mnt/iso
          sudo cp /mnt/iso/kernel /opt/android/
          sudo cp /mnt/iso/initrd.img /opt/android/

          # Create persistent 12GB ext4 virtual disk for Android
          sudo fallocate -l 12G /opt/android/android.img
          sudo mkfs.ext4 -F /opt/android/android.img >/dev/null
          sudo mount -o loop /opt/android/android.img /mnt/adisk

          sudo mkdir -p /mnt/adisk/android/data
          sudo cp /mnt/iso/ramdisk.img /mnt/adisk/android/
          sudo cp /mnt/iso/system.sfs /mnt/adisk/android/

          sudo umount /mnt/adisk
          sudo umount /mnt/iso
          sudo rm -f /tmp/android.iso

          echo "Starting Android VM with KVM hardware acceleration..."
          sudo qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -smp 4 \
            -m 6G \
            -kernel /opt/android/kernel \
            -initrd /opt/android/initrd.img \
            -append "root=/dev/ram0 androidboot.selinux=permissive quiet SRC=/android UVESA_MODE=1280x720" \
            -drive file=/opt/android/android.img,if=virtio,format=raw \
            -vga std \
            -usb -device usb-tablet \
            -audiodev none,id=snd0 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -vnc 127.0.0.1:1 \
            -daemonize

          sleep 5
          if pgrep -f qemu-system-x86_64 >/dev/null; then
            echo "SUCCESS: Android VM is running in the background."
          else
            echo "WARNING: QEMU process did not stay active."
          fi
          exit 0

      - name: Apply Desktop & Fullscreen Android Preferences
        continue-on-error: true
        shell: bash
        run: |
          set +e
          AUTOSTART_DIR="/home/runneradmin/.config/autostart"
          sudo mkdir -p "$AUTOSTART_DIR"

          # Auto-launch Android fullscreen as soon as Windows Remote Desktop connects
          cat << 'EOF' | sudo tee "${AUTOSTART_DIR}/android-fullscreen.desktop" >/dev/null
          [Desktop Entry]
          Type=Application
          Name=Android Fullscreen
          Exec=xtigervncviewer -FullScreen -Shared 127.0.0.1:5901
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF

          # Disable screen lock and power saving in XFCE
          cat << 'EOF' | sudo tee "${AUTOSTART_DIR}/disable-lock.desktop" >/dev/null
          [Desktop Entry]
          Type=Application
          Name=Disable Screen Lock
          Exec=xset s off -dpms
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          EOF

          sudo chown -R runneradmin:runneradmin /home/runneradmin/.config
          sudo systemctl restart xrdp
          echo "Desktop preferences and fullscreen Android autostart applied."
          exit 0

      - name: Connection Info
        continue-on-error: true
        shell: bash
        run: |
          RDP_PORT="${RDP_PORT:-39211}"
          echo "====================================="
          echo "Address  → ${IP}:${RDP_PORT}"
          echo "Username → runneradmin"
          echo "Password → ia-K;mNYg7^=^rG"
          echo "====================================="
          exit 0

      - name: Install Python requests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 -m pip install --upgrade pip --break-system-packages 2>/dev/null || python3 -m pip install --upgrade pip
          python3 -m pip install requests --break-system-packages 2>/dev/null || python3 -m pip install requests
          exit 0

      - name: Create and run startup.sh
        continue-on-error: true
        shell: bash
        run: |
          set +e
          STARTUP_PATH="/home/runneradmin/startup.sh"

          cat << 'EOF' | sudo tee "$STARTUP_PATH" >/dev/null
          #!/bin/bash
          echo "============================================"
          echo "STARTUP.SH"
          echo "============================================"
          echo "Host: $(hostname)"
          echo "User: $(whoami)"
          echo "Started at: $(date)"
          echo "Android VM & XRDP are active."
          echo "============================================"
          EOF

          sudo chown runneradmin:runneradmin "$STARTUP_PATH"
          sudo chmod +x "$STARTUP_PATH"
          sudo -u runneradmin bash "$STARTUP_PATH"
          exit 0

      - name: Keep Online - 5h 45m
        continue-on-error: true
        shell: bash
        run: |
          set +e
          TOTAL_SECONDS=$((5 * 3600 + 45 * 60))

          echo "============================================"
          echo "KEEP ONLINE MODE"
          echo "Duration: 5 hours 45 minutes"
          echo "============================================"

          for ((i=0; i<TOTAL_SECONDS; i+=300)); do
            REMAINING=$((TOTAL_SECONDS - i))
            HOURS=$((REMAINING / 3600))
            MINUTES=$(( (REMAINING % 3600) / 60 ))

            echo ""
            echo "[$(date)] Runner is active"
            echo "Remaining: ${HOURS} hours ${MINUTES} minutes"

            sleep 300
          done

          echo ""
          echo "============================================"
          echo "SESSION COMPLETED"
          echo "============================================"
          exit 0
